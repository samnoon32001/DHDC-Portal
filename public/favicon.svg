<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="dhdcFaviconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6452ff" />
      <stop offset="50%" stop-color="#4f39f6" />
      <stop offset="100%" stop-color="#2c17b8" />
    </linearGradient>
    <linearGradient id="goldFavicon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Rect with 4f39f6 gradient -->
  <rect width="64" height="64" rx="16" fill="url(#dhdcFaviconBg)" />
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.25" />

  <!-- Mortarboard Cap -->
  <g transform="translate(14, 10)">
    <!-- Diamond -->
    <path d="M18 3 L33 11 L18 19 L3 11 Z" fill="url(#goldFavicon)" stroke="#ffffff" stroke-width="0.8" />
    <!-- Cap Base -->
    <path d="M9 15 L9 22 C9 26, 27 26, 27 22 L27 15" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Tassel -->
    <path d="M33 11 L32 23" stroke="#fef08a" stroke-width="1.2" stroke-linecap="round" />
    <circle cx="32" cy="24" r="1.2" fill="#fef08a" />
  </g>

  <!-- DHDC Text for Favicon -->
  <g transform="translate(32, 53)">
    <rect x="-24" y="-11" width="48" height="13" rx="4" fill="#090533" fill-opacity="0.5" />
    <text x="0" y="-1.5" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="900" letter-spacing="0.8" fill="#ffffff" text-anchor="middle">
      DHDC
    </text>
  </g>
</svg>
